# Textos del sitio de Rossvtienda (Pages CMS: https://app.pagescms.org).
# Los productos, precios y secciones se editan en el panel propio del sitio
# (/admin/), que los guarda en la base de datos.
# Cada cambio que se guarda en el panel se publica solo en 1–2 minutos.

settings:
  commit:
    # Los cambios de colaboradores invitados por correo quedan con su nombre
    # y correo en el historial, para saber quién cambió qué.
    identity: user

media:
  input: src/assets
  output: /src/assets
  extensions: [jpg, jpeg, png, webp]

content:
  - name: tienda
    label: Datos de la tienda
    type: file
    path: src/data/tienda.json
    format: json
    fields:
      - name: nombre
        label: Nombre de la tienda
        type: string
        required: true
      - name: lema
        label: Lema
        type: string
      - name: descripcion
        label: Descripción para Google y redes
        type: text
      - name: whatsapp
        label: WhatsApp para pedidos
        description: Con código de país y sin espacios. En México, 52 seguido de los 10 dígitos (ej. 525512345678).
        type: string
      - name: correo
        label: Correo de contacto
        type: string
      - name: redes
        label: Redes sociales
        type: object
        fields:
          - name: instagram
            label: Instagram (enlace completo)
            type: string
          - name: tiktok
            label: TikTok (enlace completo)
            type: string
          - name: facebook
            label: Facebook (enlace completo)
            type: string
      - name: moneda
        label: Moneda
        description: Código de 3 letras, por ejemplo MXN.
        type: string
      - name: google
        label: Google
        type: object
        fields:
          - name: indexar
            label: Mostrar el sitio en Google
            type: boolean
            default: true
          - name: verificacion
            label: Código de verificación de Google Search Console
            description: Pega la etiqueta <meta> que da Search Console o solo el código.
            type: string
          - name: analytics
            label: ID de Google Analytics
            description: Empieza con G-. Si lo llenas, aparece el aviso de cookies y solo se mide a quien acepta.
            type: string
      - name: responsable
        label: Responsable de los datos (aviso de privacidad)
        type: object
        fields:
          - name: nombre
            label: Nombre completo
            type: string
          - name: domicilio
            label: Domicilio
            type: text

  - name: portada
    label: Portada
    type: file
    path: src/data/portada.json
    format: json
    fields:
      - name: antetitulo
        label: Texto pequeño sobre el título
        type: string
      - name: titulo
        label: Título
        type: string
      - name: tituloCursiva
        label: Final del título en cursiva
        type: string
      - name: bajada
        label: Texto bajo el título
        type: text
      - name: fotos
        label: Fotos de la portada
        description: De 1 a 3 fotos.
        type: image
        list:
          min: 1
          max: 3
      - name: personalizados
        label: Bloque de pedidos personalizados
        type: object
        fields:
          - name: titulo
            label: Título
            type: string
          - name: texto
            label: Texto
            type: text

  - name: como-pedir
    label: Cómo pedir, entregas y preguntas frecuentes
    type: file
    path: src/data/como-pedir.json
    format: json
    fields:
      - name: pasos
        label: Pasos
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
          - name: texto
            label: Texto
            type: text
      - name: entregas
        label: Formas de entrega
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            description: Ej. "En puntos de entrega" o "Por Uber".
            type: string
            required: true
          - name: puntos
            label: Cómo funciona
            description: Una idea por renglón.
            type: string
            list: true
          - name: datos
            label: Datos que debe mandar el cliente (opcional)
            description: Ej. "Nombre de quien recibe".
            type: string
            list: true
      - name: preguntas
        label: Preguntas frecuentes
        type: object
        list: true
        fields:
          - name: pregunta
            label: Pregunta
            type: string
          - name: respuesta
            label: Respuesta
            type: text

  - name: personalizados
    label: Pedidos personalizados
    type: file
    path: src/data/personalizados.json
    format: json
    fields:
      - name: intro
        label: Texto de introducción
        type: text
      - name: ideas
        label: Qué se puede personalizar
        type: object
        list: true
        fields:
          - name: titulo
            label: Título
            type: string
          - name: texto
            label: Texto
            type: text
      - name: ocasiones
        label: Ocasiones del formulario
        type: string
        list: true
      - name: aviso
        label: Nota bajo la lista
        type: text

  - name: galeria
    label: Galería
    type: file
    path: src/data/galeria.json
    format: json
    fields:
      - name: fotos
        label: Fotos de ramos entregados
        type: object
        list: true
        fields:
          - name: foto
            label: Foto
            type: image
            required: true
          - name: descripcion
            label: Descripción
            type: string
          - name: fecha
            label: Fecha
            type: date

  - name: opiniones
    label: Opiniones de clientes
    type: file
    path: src/data/opiniones.json
    format: json
    fields:
      - name: opiniones
        label: Opiniones
        description: Solo opiniones reales y con permiso de quien las escribió.
        type: object
        list: true
        fields:
          - name: nombre
            label: Nombre
            type: string
            required: true
          - name: texto
            label: Opinión
            type: text
            required: true
          - name: producto
            label: Producto (opcional)
            type: string

  - name: privacidad
    label: Aviso de privacidad
    type: file
    path: src/content/paginas/privacidad.md
    fields:
      - name: titulo
        label: Título
        type: string
      - name: actualizado
        label: Última actualización
        type: date
      - name: body
        label: Texto
        type: rich-text
