# Publica el sitio en GitHub Pages cada vez que hay cambios en `main`.
# Requisito (una sola vez): en GitHub, Settings → Pages → Source: "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
  # El panel de /admin/ lo lanza después de cada cambio en el catálogo.
  workflow_dispatch:
  # Una vez por semana, para que el proyecto gratis de Supabase no se pause
  # por falta de uso.
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v5
