# Publica el sitio en GitHub Pages cada vez que hay cambios en `main`.
# Requisito (una sola vez): en GitHub, Settings → Pages → Source: "GitHub Actions".
name: Publicar sitio

on:
  push:
    branches: [main]
  # El panel de /admin/ lo lanza después de cada cambio en el catálogo.
  workflow_dispatch:
  # Una vez por semana, para que el proyecto gratis de Supabase no se pause
  # por falta de uso.
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Las acciones van fijadas por SHA (el código exacto que se revisó), con la
# versión en el comentario. Dependabot propone las versiones nuevas.
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
