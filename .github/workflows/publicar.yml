# Publica el sitio en Cloudflare Pages cada vez que hay cambios en `main`.
# Requisitos (una sola vez), explicados en el README ("Publicación"):
#   - Proyecto `rossvtienda` en Cloudflare Pages.
#   - Secretos del repositorio: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: Publicar sitio

on:
  push:
    branches: [main]
  # El panel de /admin/ lo lanza después de cada cambio en el catálogo.
  workflow_dispatch:
  # Una vez por semana, para que el proyecto gratis de Supabase no se pause
  # por falta de uso.
  schedule:
    - cron: '0 12 * * 1'

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

# Las acciones van fijadas por SHA (el código exacto que se revisó), con la
# versión en el comentario. Dependabot propone las versiones nuevas.
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sitio
          path: dist
          retention-days: 1

  # Trabajo aparte: la clave de Cloudflare solo llega aquí, donde no se instalan
  # las dependencias del proyecto.
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sitio
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rossvtienda --branch=main --commit-hash=${{ github.sha }}
