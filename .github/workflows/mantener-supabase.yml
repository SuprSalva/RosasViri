# Mantiene activo el proyecto gratis de Supabase. Si pasa 7 días sin uso,
# Supabase lo pausa y el sitio ya no se puede publicar ni administrar.
#
# Solo lee una fila del catálogo con la clave pública: no publica ni cambia
# nada. Corre lunes, miércoles y viernes; GitHub a veces retrasa o se salta
# ejecuciones programadas, y así, aunque se pierda una, la siguiente llega
# antes de los 7 días. Si Supabase no responde, la ejecución falla y GitHub
# avisa por correo.
name: Mantener Supabase activo

on:
  schedule:
    # Minuto 17 (y no en punto) porque GitHub retrasa más las de las horas exactas.
    - cron: '17 15 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .env
          sparse-checkout-cone-mode: false
      - name: Leer una fila del catálogo
        run: |
          set -a; . ./.env; set +a
          url="$PUBLIC_SUPABASE_URL/rest/v1/categorias?select=id&limit=1"
          cabeceras=(-H "apikey: $PUBLIC_SUPABASE_ANON_KEY")
          # La clave clásica (empieza con "eyJ") también va como Bearer.
          if [[ "$PUBLIC_SUPABASE_ANON_KEY" == eyJ* ]]; then
            cabeceras+=(-H "Authorization: Bearer $PUBLIC_SUPABASE_ANON_KEY")
          fi
          for intento in 1 2 3; do
            if curl -fsS --max-time 20 "${cabeceras[@]}" "$url" -o /dev/null; then
              echo "Supabase respondió (intento $intento)."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Supabase no respondió. Revisa si el proyecto está en pausa: en supabase.com, abre el proyecto y usa «Restore project»."
          exit 1
