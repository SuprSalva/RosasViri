# Revisa cada semana si hay actualizaciones de seguridad o nuevas versiones
# de las dependencias del sitio y de las acciones de GitHub, y abre un PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ['*']
    ignore:
      # @astrojs/check solo acepta TypeScript 5 o 6; quitar cuando soporte la 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
